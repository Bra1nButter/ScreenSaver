name: Build & Release Lightweight APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Версия релиза (например, v1.1.0)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Signing Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "Keystore configured successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret is not set. Building with default debug key."
          fi

      - name: Extract Version Info
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "TAG_NAME=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build Lightweight Compressed arm64 APK
        run: |
          flutter pub get
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name=${{ steps.vars.outputs.VERSION_NAME }} \
            --build-number=${{ steps.vars.outputs.BUILD_NUMBER }}

      - name: Prepare APK Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             ScreenSaver-${{ steps.vars.outputs.TAG_NAME }}-arm64-v8a.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "ScreenSaver ${{ steps.vars.outputs.TAG_NAME }}"
          generate_release_notes: true
          files: ScreenSaver-${{ steps.vars.outputs.TAG_NAME }}-arm64-v8a.apk